<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="registration.js"></script>
    <title>Document</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <header class="register" onsubmit="alert('Your login has been successfully..!')">
        <h1>Registration Page</h1>
        <hr>
        <form action="login.html">
                 <div class="regis-margin">
                <div>
                 <label for="Full Name">Full Name:</label>
                 <input type="text" id="name" placeholder="Full Name" required>
                </div>
                </div>

                <div class="regis-margin">
                <div>
                    <label for="Your Email">Your Email:</label>
                    <input type="Email" id="email" placeholder="E-mail account" required>                
                </div>
                </div>

                <div class="regis-margin">
                <div>
                    <label for="Your Phone">Your Phone:</label>
                    <input type="text" id="mobile" placeholder="Contact Number" required>
                </div>
                </div>

                <div class="regis-margin">
                <div>
                    <label for="Password">Password:</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                </div>

                <div class="regis-margin">
                <div>
                    <label for="Confirm Password">Confirm Password:</label>
                    <input type="password" id="confirm" placeholder="Confirm Password" required>
                </div>
                </div>

                <div>
                    <input type="radio" id="Male" name="Gender" value="Male">
                    <label for="Male">Male</label>

                    <input type="radio" id="Female" name="Gender" value="Female">
                    <label for="Feamle">Female</label>

                    <input type="radio" id="Other" name="Gender" value="Other">
                    <label for="Other">Other</label>
                </div>

        
                <div>
                    <button type="Register"></a>Register</button>
        
                </div>
        </form>
    </header>
</body>
</html>
